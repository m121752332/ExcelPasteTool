# 推 tag（例如 1.1.0 或 v1.1.0）時自動打包各平台 zip 並建立 GitHub Release。
# 程式內的自動更新會依檔名 DataSplitter_<平台>_<架構>.zip 挑選對應的更新檔。
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  # 改到打包流程時，PR 上也跑一次打包（不建立 Release），先確認 macOS .app 等產出正常
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'packaging/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: publish (${{ matrix.id }})
    # macOS 版在 macOS runner 上打包，才能用 codesign 對整個 .app 做 ad-hoc 簽章。
    # 兩個 macOS 架構放在同一個 job 依序打包：GitHub 的 macOS 機器常要排隊、一次只排到一台，
    # 分成兩個 job 時第二個要等第一個跑完才開始，合併後只排隊一次、套件也只還原一次。
    # PR 試打包只跑 win-x64 並關掉 ReadyToRun，只確認打包流程沒壞；
    # 推 tag 正式發佈與手動執行（workflow_dispatch）則完整打包四個平台，產物與以往相同。
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"id":"win","os":"ubuntu-latest","rids":"win-x64"}]' || '[{"id":"win","os":"ubuntu-latest","rids":"win-x64"},{"id":"linux","os":"ubuntu-latest","rids":"linux-x64"},{"id":"osx","os":"macos-latest","rids":"osx-arm64 osx-x64"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # NuGet 套件快取（含各平台 runtime pack），套件版本或 SDK 有變動時 key 會跟著換
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-publish-${{ matrix.id }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-publish-${{ matrix.id }}-

      - name: Resolve version from tag
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            v="${tag#v}"
          else
            # 非 tag 觸發（PR 試打包、手動執行）：用 csproj 的版本
            v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' ExcelPasteTool.csproj | head -1)
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # 發佈、檢查內含 .NET 11 runtime、macOS 簽章與 .app 封裝、壓 zip，細節見 packaging/publish.sh
      - name: Publish ${{ matrix.rids }}
        run: |
          r2r=${{ github.event_name == 'pull_request' && 'false' || 'true' }}
          for rid in ${{ matrix.rids }}; do
            bash packaging/publish.sh "$rid" "${{ steps.ver.outputs.version }}" "$r2r"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: zips-${{ matrix.id }}
          path: DataSplitter_*.zip
          if-no-files-found: error

  release:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.zip
