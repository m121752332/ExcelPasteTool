# 推 tag（例如 1.1.0 或 v1.1.0）時自動打包各平台 zip 並建立 GitHub Release。
# 程式內的自動更新會依檔名 DataSplitter_<平台>_<架構>.zip 挑選對應的更新檔。
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            asset: DataSplitter_win_x64
          - rid: linux-x64
            asset: DataSplitter_linux_x64
          - rid: osx-x64
            asset: DataSplitter_osx_x64
          - rid: osx-arm64
            asset: DataSplitter_osx_arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version from tag
        id: ver
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Publish ${{ matrix.rid }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          dotnet publish ExcelPasteTool.csproj -c Release -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=$v -p:AssemblyVersion=$v.0 -p:FileVersion=$v.0 -p:InformationalVersion=$v \
            -o out/${{ matrix.rid }}
          cp config.json out/${{ matrix.rid }}/
          rm -f out/${{ matrix.rid }}/*.pdb

      - name: Zip
        run: |
          cd out/${{ matrix.rid }}
          chmod +x DataSplitter 2>/dev/null || true
          zip -r -X ../../${{ matrix.asset }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.zip
