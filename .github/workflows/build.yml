name: Build

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # NuGet 套件快取，套件版本或 SDK 有變動時 key 會跟著換
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-build-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-build-${{ runner.os }}-
      - name: Build
        run: dotnet build ExcelPasteTool.csproj -c Release
      - name: Test
        run: dotnet test tests/ExcelPasteTool.Tests/ExcelPasteTool.Tests.csproj -c Release
