name: Build

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build src/ExcelPasteTool/ExcelPasteTool.csproj -c Release
      - name: Test
        run: dotnet test tests/ExcelPasteTool.Tests/ExcelPasteTool.Tests.csproj -c Release
